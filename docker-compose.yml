# Peake Wörter – self-hosted stack (app + PostgreSQL).
# HTTPS is terminated by your existing reverse proxy; point it at the app port.
name: peake

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: peake
      POSTGRES_DB: peake
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt (.env bzw. Portainer-Variablen)}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peake -d peake"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  app:
    image: peake-woerter:latest
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://peake:${POSTGRES_PASSWORD}@db:5432/peake
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET fehlt (.env bzw. Portainer-Variablen)}
      BETTER_AUTH_URL: ${PUBLIC_URL:?PUBLIC_URL fehlt (.env bzw. Portainer-Variablen)}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      AI_API_KEY: ${AI_API_KEY:-}
    volumes:
      - appdata:/data
    # Lets the app reach local AI servers on the Docker host (Ollama, LM Studio).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # All interfaces by default (APP_BIND), so a proxy container can reach it via the host IP.
      # Set APP_BIND=127.0.0.1 to restrict it to localhost.
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-3000}:3000"
    networks: [internal]

volumes:
  dbdata:
  appdata:

networks:
  internal:
